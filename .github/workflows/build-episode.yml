name: Build episode

on:
  push:
    branches: [main]
    paths: ["scripts/*.txt", "build_episode.py", ".github/workflows/build-episode.yml"]
  workflow_dispatch:
    inputs:
      date:
        description: "Script date to rebuild (YYYY-MM-DD). Blank = newest."
        required: false

permissions:
  contents: write

concurrency:
  group: build-episode
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts mutagen piper-tts
      - name: Generate audio, publish, update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_episode.py ${{ github.event.inputs.date }}
      - name: Commit feed (or error log)
        if: always()
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git commit -m "Update feed [skip ci]" || exit 0
          git pull --rebase
          git push
