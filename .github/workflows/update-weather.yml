name: Update weather

# Triggered by the iPhone Shortcuts automation (POST /repos/DocHomer/morning-brief/dispatches
# with event_type "location"). Saves the NWS forecast to weather/latest.json.
on:
  repository_dispatch:
    types: [location]
  workflow_dispatch:  # manual test
    inputs:
      lat: {description: "Latitude", required: true, default: "38.2527"}
      lon: {description: "Longitude", required: true, default: "-85.7585"}
      city: {description: "City", required: false, default: "Louisville"}
      state: {description: "State", required: false, default: "KY"}

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecast
        run: python update_weather.py
      - name: Commit forecast
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add weather/latest.json
          git commit -m "Update weather [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
